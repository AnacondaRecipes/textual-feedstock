{% set name = "textual" %}
{% set version = "8.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/textual-{{ version }}.tar.gz
  sha256: fe6544e57651a7c2a8249b90ec542b45fa945ce4560e69b0d563fb440e7c4db3

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
    - poetry-core >=1.2.0
  run:
    - python
    - markdown-it-py >=2.1.0
    # markdown-it-py[linkify]
    - linkify-it-py >=1,<3
    - mdit-py-plugins
    - rich >=14.2.0
    - typing_extensions >=4.4.0,<5.0.0
    - platformdirs >=3.6.0,<5
    - pygments >=2.19.2,<3.0.0
  run_constrained:
    - tree-sitter >=0.25.0  # [py>=310]
    - tree-sitter-python >=0.23.0  # [py>=310]
    - tree-sitter-markdown >=0.3.0  # [py>=310]
    - tree-sitter-json >=0.24.0  # [py>=310]
    - tree-sitter-toml >=0.6.0  # [py>=310]
    - tree-sitter-yaml >=0.6.0  # [py>=310]
    - tree-sitter-html >=0.23.0  # [py>=310]
    - tree-sitter-css >=0.23.0  # [py>=310]
    - tree-sitter-javascript >=0.23.0  # [py>=310]
    - tree-sitter-rust >=0.23.0  # [py>=310]
    - tree-sitter-go >=0.23.0  # [py>=310]
    - tree-sitter-regex >=0.24.0  # [py>=310]
    - tree-sitter-xml >=0.7.0  # [py>=310]
    - tree-sitter-sql >=0.3.11  # [py>=310]
    - tree-sitter-java >=0.23.0  # [py>=310]
    - tree-sitter-bash >=0.23.0  # [py>=310]

# missing pytest-textual-snapshot
{% set ignore_tests = " --ignore=tests/snapshot_tests/test_snapshots.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_progress_bar.py" %}
# >           assert "highlight_start" in animations
# E           AssertionError: assert 'highlight_start' in []
{% set ignore_tests = ignore_tests + " --ignore=tests/animations/test_tabs_underline_animation.py" %}  # [win]
# E       AssertionError: assert None is not None
# E        +  where None = App(title='App', classes={'-dark-mode'}, pseudo_classes={'dark', 'focus'}).devtools
{% set deselect_tests = "--deselect=tests/test_features.py::test_textual_env_var" %}

test:
  source_files:
    - tests
    - docs
  imports:
    - textual
  requires:
    - pip
    - pytest >=8.3.1,<9
    - pytest-asyncio
  commands:
    - pip check
    - pytest -v -o asyncio_mode=auto -m "not syntax" tests {{ ignore_tests }} {{ deselect_tests }}

about:
  home: https://github.com/Textualize/textual
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Textual is a Rapid Application Development framework for Python, built by Textualize.io.
  description: Textual is a Rapid Application Development framework for Python, built by Textualize.io.
  dev_url: https://github.com/Textualize/textual
  doc_url: https://textual.textualize.io