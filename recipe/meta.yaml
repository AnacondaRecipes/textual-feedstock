{% set name = "textual" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bec9fe63547c1c552569d1b75d309038b7d456c03f86dfa3706ddb099b151399

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
    - poetry-core >=1.2.0
  run:
    - python
    - markdown-it-py >=2.1.0
    # markdown-it-py[linkify]
    - linkify-it-py >=1,<3
    # markdown-it-py[plugins]
    - mdit-py-plugins
    - rich >=13.3.3
    - typing_extensions >=4.4.0,<5.0.0
    - platformdirs >=3.6.0,<5
  run_constrained:
    - tree-sitter >=0.23.0  # [py>=39]
    - tree-sitter-python >=0.23.0  # [py>=39]
    - tree-sitter-markdown >=0.3.0  # [py>=39]
    - tree-sitter-json >=0.24.0  # [py>=39]
    - tree-sitter-toml >=0.6.0  # [py>=39]
    - tree-sitter-yaml >=0.6.0  # [py>=39]
    - tree-sitter-html >=0.23.0  # [py>=39]
    - tree-sitter-css >=0.23.0  # [py>=39]
    - tree-sitter-javascript >=0.23.0  # [py>=39]
    - tree-sitter-rust >=0.23.0  # [py>=39]
    - tree-sitter-go >=0.23.0  # [py>=39]
    - tree-sitter-regex >=0.24.0  # [py>=39]
    - tree-sitter-xml >=0.7.0  # [py>=39]
    - tree-sitter-sql >=0.3.0  # [py>=39]
    - tree-sitter-java >=0.23.0  # [py>=39]
    - tree-sitter-bash >=0.23.0  # [py>=39]

# E       AssertionError: assert None is not None
# E        +  where None = App(title='App', classes={'-dark-mode'}, pseudo_classes={'dark', 'focus'}).devtools
{% set deselect_tests = "--deselect=tests/test_features.py::test_textual_env_var" %}
# Deselected: these tests call Textual's push_screen() synchronously (outside
# app.run_test()/an event loop), which relied on asyncio.get_event_loop()'s
# implicit loop creation. That fallback was removed in Python 3.13/3.14,
# so these fail with "RuntimeError: no current event loop" on 3.13/3.14.
# Upstream bug: https://bugzilla.redhat.com/show_bug.cgi?id=2367457
# Remove once fixed in Textual.
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_focus_chain" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_allow_focus" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_focus_next_and_previous_with_type_selector_without_self" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_focus_next_and_previous" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_focus_next_wrap_around" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_focus_previous_wrap_around" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_wrap_around_selector" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_no_focus_empty_selector" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_focus_next_and_previous_with_type_selector" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_focus_next_and_previous_with_str_selector" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_focus.py::test_focus_next_and_previous_with_str_selector_without_self" %}
# missing pytest-textual-snapshot
{% set ignore_tests = " --ignore=tests/snapshot_tests/test_snapshots.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_progress_bar.py" %}
# Flaky on Windows
{% set ignore_tests = ignore_tests + " --ignore=tests/animations" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=tests/test_pilot.py::test_pilot_target_on_widget_that_is_not_visible_errors" %}  # [win]

test:
  source_files:
    - tests
    - docs
  imports:
    - textual
  requires:
    - pip
    - pytest
    - pytest-asyncio
  commands:
    - pip check
    - pytest -vv -o asyncio_mode=auto -m "not syntax" tests {{ ignore_tests }} {{ deselect_tests }}

about:
  home: https://github.com/Textualize/textual
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Textual is a Rapid Application Development framework for Python, built by Textualize.io.
  description: Textual is a Rapid Application Development framework for Python, built by Textualize.io.
  dev_url: https://github.com/Textualize/textual
  doc_url: https://textual.textualize.io